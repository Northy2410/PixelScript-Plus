name: Build PixelScript+ (Windows, Mac, Linux)

# Adds the "Run workflow" button in the Actions tab
on:
  workflow_dispatch:

# The graph:
#
#            build (Windows / Mac / Linux)
#                  |
#         +--------+--------+
#         |                 |
#     installers          zips
#         |                 |
#         +--------+--------+
#                  |
#          package (App folder)

jobs:
  # ------------------------------------------------------------------
  # 1. BUILD the app on each OS
  # ------------------------------------------------------------------
  build:
    name: Build app (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            data_sep: ";"
            icon: Icon.ico
          - os: macos-latest
            label: mac
            data_sep: ":"
            icon: Icon.png
          - os: ubuntu-latest
            label: linux
            data_sep: ":"
            icon: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography pillow pyinstaller pytest

      - name: Test app features
        shell: bash
        run: |
          python -m pytest -q
          python -m py_compile PixelScript.py pixelscript_markdown.py

      # The app expects Icon.png and logo.png next to the code. Yours may be in an
      # assets/ folder with different capitalisation, so find them and copy them.
      - name: Put assets where the app expects them
        shell: bash
        run: |
          LABEL="${{ matrix.label }}"
          echo "=== Files in your repo ==="
          find . -type f -not -path "./.git/*" | sort
          echo "=========================="
          find_file() {
            find . -type f -iname "$1" -not -path "./.git/*" -not -path "./dist/*" -not -path "./build/*" | head -n1
          }
          # place <name to look for> <name to copy to> <required on: all | windows>
          place() {
            src="$(find_file "$1")"
            if [ -z "$src" ]; then
              if [ "$3" = "all" ] || [ "$3" = "$LABEL" ]; then
                echo "ERROR: could not find '$1' anywhere in the repo"; exit 1
              fi
              echo "WARNING: '$1' not found (not needed for this build)"; return 0
            fi
            if [ "$src" -ef "$2" ]; then echo "$2 already in place"; else cp -f "$src" "$2"; echo "Copied $src -> $2"; fi
          }
          place icon.png Icon.png all
          place logo.png logo.png all
          place icon.ico Icon.ico windows

      - name: Build app with PyInstaller
        shell: bash
        run: |
          ICON_ARG=""
          if [ -n "${{ matrix.icon }}" ]; then ICON_ARG="--icon ${{ matrix.icon }}"; fi
          pyinstaller --noconfirm --onefile --windowed --name PixelScript $ICON_ARG \
            --add-data "Icon.png${{ matrix.data_sep }}." \
            --add-data "logo.png${{ matrix.data_sep }}." \
            PixelScript.py

      # Packed into a .tar so file permissions survive being passed between jobs
      - name: Pack the built app
        shell: bash
        run: tar -cf raw.tar dist

      - name: Save built app for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.label }}
          path: raw.tar
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2a. INSTALLERS (runs at the same time as zips)
  # ------------------------------------------------------------------
  installers:
    name: Make installer (${{ matrix.label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: mac
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: raw-${{ matrix.label }}
          path: raw

      - name: Unpack the built app
        shell: bash
        run: tar -xf raw/raw.tar

      - name: Put installer assets in place
        shell: bash
        run: |
          LABEL="${{ matrix.label }}"
          find_file() {
            find . -type f -iname "$1" -not -path "./.git/*" -not -path "./dist/*" -not -path "./build/*" -not -path "./raw/*" | head -n1
          }
          place() {
            src="$(find_file "$1")"
            if [ -z "$src" ]; then
              if [ "$3" = "$LABEL" ]; then echo "ERROR: could not find '$1' anywhere in the repo"; exit 1; fi
              echo "WARNING: '$1' not found (not needed here)"; return 0
            fi
            if [ "$src" -ef "$2" ]; then echo "$2 already in place"; else cp -f "$src" "$2"; echo "Copied $src -> $2"; fi
          }
          place icon.png Icon.png linux
          place icon.ico Icon.ico windows
          place inslogo.bmp inslogo.bmp windows
          if [ -n "$(find_file Licence.txt)" ]; then place Licence.txt Licence.txt windows; else place Licence Licence.txt windows; fi

      # ---------- Windows: NSIS installer from your installer.nsi ----------
      - name: Build Windows installer
        if: matrix.label == 'windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" installer.nsi
          mkdir installer_out
          cp "PixelScript+ Setup.exe" installer_out/

      # ---------- Mac: .dmg with an Applications shortcut ----------
      - name: Build Mac installer (.dmg)
        if: matrix.label == 'mac'
        shell: bash
        run: |
          mkdir -p dmg_staging installer_out
          cp -R dist/PixelScript.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "PixelScript+" -srcfolder dmg_staging -ov -format UDZO "installer_out/PixelScript+ Installer.dmg"

      # ---------- Linux: .deb package ----------
      - name: Build Linux installer (.deb)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          VERSION="$(grep -m1 'CURRENT_VERSION' PixelScript.py | cut -d'"' -f2)"
          VERSION="${VERSION:-1.0}"
          PKG=pixelscript-plus
          ROOT="deb/${PKG}_${VERSION}"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/pixelscript-plus" "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" "$ROOT/usr/share/pixmaps"
          cp dist/PixelScript "$ROOT/opt/pixelscript-plus/PixelScript"
          chmod 755 "$ROOT/opt/pixelscript-plus/PixelScript"
          ln -s /opt/pixelscript-plus/PixelScript "$ROOT/usr/bin/pixelscript-plus"
          cp Icon.png "$ROOT/usr/share/pixmaps/pixelscript-plus.png"
          cat > "$ROOT/usr/share/applications/pixelscript-plus.desktop" <<DESKTOP
          [Desktop Entry]
          Name=PixelScript+
          Exec=/opt/pixelscript-plus/PixelScript
          Icon=pixelscript-plus
          Type=Application
          Categories=Utility;TextEditor;
          Terminal=false
          DESKTOP
          sed -i 's/^ *//' "$ROOT/usr/share/applications/pixelscript-plus.desktop"
          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: ${PKG}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Northy2410
          Description: PixelScript+ text editor
          CONTROL
          sed -i 's/^ *//' "$ROOT/DEBIAN/control"
          mkdir installer_out
          dpkg-deb --build "$ROOT" "installer_out/PixelScript+_${VERSION}_amd64.deb"

      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: installer_out/
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2b. ZIPS (runs at the same time as installers)
  # ------------------------------------------------------------------
  zips:
    name: Zip the apps
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: raw-windows
          path: raw/windows

      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: raw-mac
          path: raw/mac

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: raw-linux
          path: raw/linux

      - name: Create the zip files
        shell: bash
        run: |
          W="$GITHUB_WORKSPACE"
          for os in windows mac linux; do
            mkdir -p "$W/unpacked/$os" "$W/zips/$os"
            tar -xf "$W/raw/$os/raw.tar" -C "$W/unpacked/$os"
          done
          (cd "$W/unpacked/windows/dist" && zip -r "$W/zips/windows/PixelScript-windows.zip" PixelScript.exe)
          (cd "$W/unpacked/mac/dist"     && zip -ry "$W/zips/mac/PixelScript-mac.zip" PixelScript.app)
          (cd "$W/unpacked/linux/dist"   && zip -r "$W/zips/linux/PixelScript-linux.zip" PixelScript)

      - name: Save zips
        uses: actions/upload-artifact@v4
        with:
          name: zips
          path: zips/
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3. PACKAGE everything into one "App" folder
  # ------------------------------------------------------------------
  package:
    name: Put everything in the App folder
    needs: [installers, zips]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: installers/windows

      - name: Download Mac installer
        uses: actions/download-artifact@v4
        with:
          name: installer-mac
          path: installers/mac

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: installer-linux
          path: installers/linux

      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          name: zips
          path: zips

      - name: Build the App folder
        shell: bash
        run: |
          mkdir -p out/App/Windows out/App/Mac out/App/Linux
          cp installers/windows/* zips/windows/* out/App/Windows/
          cp installers/mac/*     zips/mac/*     out/App/Mac/
          cp installers/linux/*   zips/linux/*   out/App/Linux/
          echo "=== Final layout ==="
          find out -type f | sort

      - name: Upload App folder
        uses: actions/upload-artifact@v4
        with:
          name: App
          path: out/
          if-no-files-found: error
