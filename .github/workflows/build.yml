name: Build PixelScript+ (Windows, Mac, Linux)

# Adds the "Run workflow" button in the Actions tab
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            data_sep: ";"
            icon: Icon.ico
          - os: macos-latest
            label: mac
            data_sep: ":"
            icon: Icon.png
          - os: ubuntu-latest
            label: linux
            data_sep: ":"
            icon: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography pillow pyinstaller

      # Your assets live in an assets/ folder on GitHub, but the app and installer
      # expect them next to the code with specific names (Icon.png, logo.png, etc).
      # This finds them wherever they are (ignoring upper/lower case) and copies them.
      - name: Put assets where the app expects them
        shell: bash
        run: |
          find_file() {
            find . -type f -iname "$1" -not -path "./.git/*" -not -path "./dist/*" -not -path "./build/*" | head -n1
          }
          place() {
            src="$(find_file "$1")"
            if [ -z "$src" ]; then echo "ERROR: could not find $1 in the repo"; exit 1; fi
            if [ "$src" -ef "$2" ]; then echo "$2 already in place"; else cp -f "$src" "$2"; echo "Copied $src -> $2"; fi
          }
          place icon.png Icon.png
          place logo.png logo.png
          place icon.ico Icon.ico
          if [ -n "$(find_file Licence.txt)" ]; then place Licence.txt Licence.txt; else place Licence Licence.txt; fi
          # The installer wants a .bmp banner; convert from the jpg
          python - <<'EOF'
          import glob, os
          from PIL import Image
          paths = [p for p in glob.glob("**/*", recursive=True) if os.path.basename(p).lower() == "inslogo.jpg"]
          if not paths:
              raise SystemExit("ERROR: could not find inslogo.jpg in the repo")
          Image.open(paths[0]).convert("RGB").save("inslogo.bmp")
          print("Created inslogo.bmp")
          EOF

      - name: Build app with PyInstaller
        shell: bash
        run: |
          ICON_ARG=""
          if [ -n "${{ matrix.icon }}" ]; then ICON_ARG="--icon ${{ matrix.icon }}"; fi
          pyinstaller --noconfirm --onefile --windowed --name PixelScript $ICON_ARG \
            --add-data "Icon.png${{ matrix.data_sep }}." \
            --add-data "logo.png${{ matrix.data_sep }}." \
            PixelScript.py

      # ---------- Windows: make the installer ----------
      - name: Build Windows installer
        if: matrix.label == 'windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" installer.nsi

      - name: Collect Windows files
        if: matrix.label == 'windows'
        shell: bash
        run: |
          mkdir out
          cp dist/PixelScript.exe out/
          cp "PixelScript+ Setup.exe" out/

      # ---------- Mac: zip the .app so it keeps working ----------
      - name: Collect Mac files
        if: matrix.label == 'mac'
        shell: bash
        run: |
          mkdir out
          ditto -c -k --keepParent dist/PixelScript.app out/PixelScript-mac.zip

      # ---------- Linux: tar.gz keeps the "executable" permission ----------
      - name: Collect Linux files
        if: matrix.label == 'linux'
        shell: bash
        run: |
          mkdir out
          chmod +x dist/PixelScript
          tar -czf out/PixelScript-linux.tar.gz -C dist PixelScript

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PixelScript-${{ matrix.label }}
          path: out/
          if-no-files-found: error
